<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generative Writing Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- top-left auth links (no header bar) -->
<div class="nav-links top-left">
    <a href="/login">Login</a>
    <a href="/register">Register</a>
</div>

<!-- main form -->
<form id="search_form">
    <label for="search_input">writing engine</label>

    <div class="search-row">
        <input
            type="text"
            id="search_input"
            name="search_input"
            placeholder="search ..."
            required
        >

        <button type="submit">Search</button>
    </div>

    <div class="action-row">
        <button type="button">Add</button>
        <button type="button">Remove</button>
        <button type="button">Process</button>
    </div>
</form>

<div id="results"></div>

<script src="{{ url_for('static', filename='search.js') }}"></script>

</body>
</html>
