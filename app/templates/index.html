<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confine</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>

<!-- USER STATUS -->
<div class="user-status">
    <span class="label">user:</span>
    <span class="username logged-out">unknown</span>
</div>

<!-- NAV -->
<div class="nav-links">
    <a href="/session" class="auth-button">login / register</a>
</div>

<div class="confine-label">confine</div>

<form id="search_form">

    <div class="search-row">
        <input
            type="text"
            id="search_input"
            name="search_input"
            placeholder="search ..."
            required
        >
        <button type="submit">Search</button>
    </div>

    <div class="action-row">
        <button type="button" id="add_btn">Add</button>
        <button type="button" id="remove_btn">Remove</button>

        <select id="mode_select" name="mode_select" class="mode-select">
            <option value="Transform">Transform</option>
            <option value="Analyze">Analyze</option>
            <option value="Combine">Combine</option>
        </select>

        <button type="button">Process</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="tab-bar">
            <button type="button" class="tab active" data-tab="search">SEARCH</button>
            <button type="button" class="tab" data-tab="workspace">WORKSPACE</button>
            <button type="button" class="tab" data-tab="concepts">CONCEPTS</button>
            <button type="button" class="tab" data-tab="semantics">SEMANTICS</button>
            <button type="button" class="tab" data-tab="instructions">INSTRUCTIONS</button>
            <button type="button" class="tab" data-tab="input">INPUT</button>
            <button type="button" class="tab" data-tab="output">OUTPUT</button>
        </div>

        <div class="tab-content">
            <div class="panel active" id="search">SEARCH PANEL</div>

            <div class="panel" id="workspace">
                <div id="workspace_list"></div>
            </div>

            <div class="panel" id="concepts">
                <div id="concepts_list"></div>
            </div>

            <div class="panel" id="semantics">
                <div id="semantics_list"></div>
            </div>

            <div class="panel" id="instructions">
                <div id="instructions_list"></div>
            </div>

            <div class="panel" id="input">
                <div id="input_list"></div>
            </div>

            <div class="panel" id="output">
                <div id="output_list"></div>
            </div>
        </div>

    </div>

</form>

<div id="results"></div>

<!-- IMPORTANT ORDER -->
<script src="{{ url_for('static', filename='index.js') }}"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
