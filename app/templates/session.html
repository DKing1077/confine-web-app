<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='session.css') }}">
</head>

<body>

<!-- USER STATUS -->
<div class="user-status">
    <span class="label">user:</span>
    <span class="username logged-out">unknown</span>
</div>

<!-- NAV -->
<div class="nav-left">
    <a href="/" class="nav-link">home</a>
</div>

<div class="nav-right">
    <a href="/confine" class="nav-link">confine</a>
</div>

<!-- CENTER WRAPPER -->
<div class="session-wrapper">

    <form id="session_form">

        <input
            type="email"
            id="email_input"
            name="email"
            placeholder="email ..."
            required
        >

        <input
            type="password"
            id="password_input"
            name="password"
            placeholder="password ..."
            required
        >

        <div class="mode-toggle">
            <button type="button" class="mode-btn active" data-mode="login">
                login
            </button>

            <button type="button" class="mode-btn" data-mode="logout">
                logout
            </button>

            <button type="button" class="mode-btn" data-mode="register">
                register
            </button>
        </div>

        <button type="submit" class="submit-btn">
            submit
        </button>

    </form>

    <div id="auth_results"></div>

</div>

<!-- IMPORTANT ORDER -->
<script src="{{ url_for('static', filename='session.js') }}"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
